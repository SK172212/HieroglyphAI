<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">



    <meta

        name="viewport"

        content="

            width=device-width,

            initial-scale=1.0,

            maximum-scale=1.0,

            user-scalable=no,

            viewport-fit=cover

        "

    >



    <link

        rel="stylesheet"

        href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"

    >



    <style>

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }



        html,

        body {

            width: 100%;

            height: 100%;



            margin: 0;

            padding: 0;



            overflow: hidden;

            overscroll-behavior: none;



            background: black;



            font-family:

                -apple-system,

                BlinkMacSystemFont,

                "Segoe UI",

                Arial,

                sans-serif;

        }



        body.component-active {

            touch-action: none;

        }



        #camera-screen,

        #upload-screen,

        #review-screen,

        #crop-result-screen {

            position: fixed;

            inset: 0;



            width: 100%;

            height: 100%;



            overflow: hidden;

            background: black;

        }



        #camera-screen,

        #upload-screen,

        #review-screen,

        #crop-result-screen {

            display: none;

        }



        /*

         * ====================================================

         * SHARED CLOSE BUTTON

         * ====================================================

         */



        .close-button {

            position: absolute;

            top: max(12px, env(safe-area-inset-top));

            right: max(12px, env(safe-area-inset-right));

            z-index: 100;



            display: flex;

            align-items: center;

            justify-content: center;



            width: 42px;

            height: 42px;

            padding: 0;



            border: none;

            border-radius: 50%;



            color: white;

            background: rgba(0, 0, 0, 0.55);



            font-family:

                -apple-system,

                BlinkMacSystemFont,

                "Segoe UI",

                Arial,

                sans-serif;



            font-size: 30px;

            font-weight: 300;

            line-height: 1;



            cursor: pointer;



            backdrop-filter: blur(6px);

            -webkit-backdrop-filter: blur(6px);

        }



        .close-button:active {

            transform: scale(0.94);

        }



        /*

         * ====================================================

         * CAMERA SCREEN

         * ====================================================

         */



        #camera-video {

            display: block;



            width: 100%;

            height: 100%;



            object-fit: cover;

            background: black;



            user-select: none;

            -webkit-user-select: none;

        }



        #status {

            position: absolute;

            top: max(14px, env(safe-area-inset-top));

            left: 16px;

            right: 70px;

            z-index: 20;



            padding: 11px 14px;



            border-radius: 10px;



            color: white;

            background: rgba(0, 0, 0, 0.68);



            text-align: center;

            font-size: 15px;

        }



        #zoom-controls {

            position: absolute;

            left: 20px;

            right: 20px;

            bottom: calc(112px + env(safe-area-inset-bottom));

            z-index: 20;



            display: none;

            align-items: center;

            gap: 12px;



            padding: 10px 14px;



            border-radius: 12px;



            color: white;

            background: rgba(0, 0, 0, 0.58);



            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(5px);

        }



        #zoom-slider {

            flex: 1;

            min-width: 0;

        }



        #zoom-min,

        #zoom-max {

            min-width: 34px;



            font-size: 14px;

            text-align: center;

        }



        .camera-controls {

            position: absolute;

            left: 0;

            right: 0;

            bottom: calc(18px + env(safe-area-inset-bottom));

            z-index: 20;



            display: flex;

            justify-content: center;

            align-items: center;

        }



        #shutter-button {

            width: 76px;

            height: 76px;



            padding: 0;



            border: 6px solid white;

            border-radius: 50%;



            outline: none;

            background: rgba(255, 255, 255, 0.25);



            cursor: pointer;

        }



        #shutter-button::after {

            content: "";



            display: block;



            width: 56px;

            height: 56px;



            margin: auto;



            border-radius: 50%;

            background: white;

        }



        #shutter-button:active {

            transform: scale(0.92);

        }



        /*

         * ====================================================

         * UPLOAD SCREEN

         * ====================================================

         */



        #upload-screen {

            background:

                radial-gradient(

                    circle at top,

                    #222222 0%,

                    #080808 55%,

                    #000000 100%

                );

        }



        .upload-content {

            display: flex;

            align-items: center;

            justify-content: center;



            width: 100%;

            height: 100%;



            padding:

                calc(72px + env(safe-area-inset-top))

                22px

                calc(30px + env(safe-area-inset-bottom));

        }



        .upload-card {

            width: 100%;

            max-width: 440px;



            padding: 34px 24px;



            border:

                1px solid

                rgba(255, 255, 255, 0.16);



            border-radius: 22px;



            color: white;

            background:

                rgba(255, 255, 255, 0.08);



            text-align: center;



            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }



        .upload-card.drag-over {
            border-color: #50cbd0;
            background: rgba(32, 144, 153, 0.24);
            box-shadow: 0 0 0 3px rgba(80, 203, 208, 0.25);
        }

        .upload-card.drag-over .upload-hint { color: #9ce7e9; }

        .upload-icon {

            display: flex;

            align-items: center;

            justify-content: center;



            width: 72px;

            height: 72px;



            margin: 0 auto 18px;



            border-radius: 20px;



            background:

                rgba(255, 255, 255, 0.12);



            font-size: 36px;

        }



        .upload-card h1 {

            margin: 0 0 12px;



            font-size: 28px;

            line-height: 1.2;

        }



        .upload-card p {

            margin: 0 0 28px;



            color:

                rgba(255, 255, 255, 0.76);



            font-size: 16px;

            line-height: 1.5;

        }



        .upload-card .upload-hint {
            margin: 18px 0 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
        }

        #choose-image-button {

            width: 100%;

            max-width: none;

        }



        /*

         * ====================================================

         * CROP SCREEN

         * ====================================================

         */



        #review-screen {

            padding-bottom:

                calc(

                    86px

                    + env(safe-area-inset-bottom)

                );

        }



        #crop-area {

            width: 100%;

            height: 100%;



            overflow: hidden;

            background: black;

        }



        #captured-image {

            display: block;

            max-width: 100%;

        }



        #review-screen .cropper-container {

            width: 100% !important;

            height: 100% !important;

        }



        #review-screen .cropper-view-box,

        #review-screen .cropper-face {

            border-radius: 2px;

        }



        #review-screen .cropper-line {

            background-color: white;

        }



        #review-screen .cropper-point {

            width: 14px;

            height: 14px;



            border-radius: 50%;

            background-color: white;



            opacity: 1;

        }



        /*

         * ====================================================

         * FINAL CROP SCREEN

         * ====================================================

         */



        #crop-result-screen {

            padding-bottom:

                calc(

                    86px

                    + env(safe-area-inset-bottom)

                );

        }



        #crop-result-image-area {

            width: 100%;

            height: 100%;



            overflow: hidden;

            background: black;

        }



        #cropped-image {

            display: block;



            width: 100%;

            height: 100%;



            object-fit: contain;

            background: black;

        }



        /*

         * ====================================================

         * SHARED BOTTOM CONTROLS

         * ====================================================

         */



        .bottom-controls {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 30;



            display: flex;

            justify-content: center;

            gap: 14px;



            min-height:

                calc(

                    86px

                    + env(safe-area-inset-bottom)

                );



            padding:

                14px

                18px

                calc(

                    14px

                    + env(safe-area-inset-bottom)

                );



            background: rgba(0, 0, 0, 0.9);



            backdrop-filter: blur(8px);

            -webkit-backdrop-filter: blur(8px);

        }



        .action-button {

            flex: 1;



            max-width: 220px;

            min-height: 50px;



            padding: 12px 18px;



            border: none;

            border-radius: 12px;



            font-family:

                -apple-system,

                BlinkMacSystemFont,

                "Segoe UI",

                Arial,

                sans-serif;



            font-size: 17px;

            font-weight: 650;



            cursor: pointer;

        }



        .action-button:disabled {

            cursor: default;

            opacity: 0.72;

        }



        .secondary-button {

            color: black;

            background: white;

        }



        .primary-button {

            color: white;

            background: #1769e0;

        }



        .action-button:not(:disabled):active {

            transform: scale(0.97);

        }



        /*

         * Desktop remains centered and narrower.

         * Mobile fills the complete viewport.

         */



        @media (min-width: 900px) {

            #camera-screen,

            #upload-screen,

            #review-screen,

            #crop-result-screen {

                max-width: 760px;



                left: 50%;

                right: auto;



                transform: translateX(-50%);

            }

        }

    </style>

</head>



<body>



    <!-- =====================================================

         LIVE CAMERA SCREEN

         ===================================================== -->



    <section id="camera-screen">



        <button

            id="close-camera-button"

            class="close-button"

            type="button"

            aria-label="Close camera"

        >

            ×

        </button>



        <video

            id="camera-video"

            autoplay

            playsinline

            muted

        ></video>



        <div id="status">

            Opening camera...

        </div>



        <div id="zoom-controls">



            <span id="zoom-min">

                1×

            </span>



            <input

                id="zoom-slider"

                type="range"

                min="1"

                max="1"

                step="0.1"

                value="1"

                aria-label="Camera zoom"

            >



            <span id="zoom-max">

                1×

            </span>



        </div>



        <div class="camera-controls">



            <button

                id="shutter-button"

                type="button"

                aria-label="Take photo"

            ></button>



        </div>



    </section>



    <!-- =====================================================

         UPLOAD SCREEN

         ===================================================== -->



    <section id="upload-screen">



        <button

            id="close-upload-button"

            class="close-button"

            type="button"

            aria-label="Close upload"

        >

            ×

        </button>



        <div class="upload-content">



            <div class="upload-card" id="upload-drop-zone" aria-label="Drop or paste an image">



                <div class="upload-icon">

                    🖼️

                </div>



                <h1>

                    Choose an Image

                </h1>



                <p>

                    Select a photograph of a hieroglyphic

                    inscription from Photos or Files.

                </p>



                <button

                    id="choose-image-button"

                    class="

                        action-button

                        primary-button

                    "

                    type="button"

                >

                    Choose Image

                </button>

                <p class="upload-hint" id="upload-hint">
                    Or drop an image here. You can also copy an image and paste it.
                </p>



                <!--

                    No capture attribute is used.



                    This allows the operating system to provide

                    its standard image-selection choices instead

                    of forcing the camera to open.

                -->

                <input

                    id="image-file-input"

                    type="file"

                    accept="image/*"

                    hidden

                >



            </div>



        </div>



    </section>



    <!-- =====================================================

         CROP SCREEN

         ===================================================== -->



    <section id="review-screen">



        <div id="crop-area">



            <img

                id="captured-image"

                alt="Image ready to crop"

            >



        </div>



        <div class="bottom-controls">



            <button

                id="restart-button"

                class="

                    action-button

                    secondary-button

                "

                type="button"

            >

                Retake

            </button>



            <button

                id="use-crop-button"

                class="

                    action-button

                    primary-button

                "

                type="button"

            >

                Use Crop

            </button>



        </div>



    </section>



    <!-- =====================================================

         FINAL CROP PREVIEW

         ===================================================== -->



    <section id="crop-result-screen">



        <div id="crop-result-image-area">



            <img

                id="cropped-image"

                alt="Final cropped image"

            >



        </div>



        <div class="bottom-controls">



            <button

                id="edit-crop-button"

                class="

                    action-button

                    secondary-button

                "

                type="button"

            >

                Edit Crop

            </button>



            <button

                id="confirm-crop-button"

                class="

                    action-button

                    primary-button

                "

                type="button"

            >

                Confirm

            </button>



        </div>



    </section>



    <canvas

        id="capture-canvas"

        hidden

    ></canvas>



    <script

        src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"

    ></script>



    <script>

        /*

         * ====================================================

         * STREAMLIT COMPONENT COMMUNICATION

         * ====================================================

         */



        const STREAMLIT_API_VERSION = 1;



        const COMPONENT_HEIGHT =

            window.innerHeight || 700;



        function sendStreamlitMessage(

            type,

            data = {}

        ) {

            window.parent.postMessage(

                {

                    isStreamlitMessage: true,

                    type: type,

                    ...data

                },

                "*"

            );

        }



        function notifyStreamlitReady() {

            sendStreamlitMessage(

                "streamlit:componentReady",

                {

                    apiVersion:

                        STREAMLIT_API_VERSION

                }

            );

        }



        function setStreamlitFrameHeight(

            height =

                window.innerHeight

                || COMPONENT_HEIGHT

        ) {

            sendStreamlitMessage(

                "streamlit:setFrameHeight",

                {

                    height: height

                }

            );

        }



        function sendValueToStreamlit(

            value

        ) {

            sendStreamlitMessage(

                "streamlit:setComponentValue",

                {

                    value: value,

                    dataType: "json"

                }

            );

        }



        /*

         * ====================================================

         * ELEMENT REFERENCES

         * ====================================================

         */



        const cameraScreen =

            document.getElementById(

                "camera-screen"

            );



        const uploadScreen =

            document.getElementById(

                "upload-screen"

            );



        const reviewScreen =

            document.getElementById(

                "review-screen"

            );



        const cropResultScreen =

            document.getElementById(

                "crop-result-screen"

            );



        const video =

            document.getElementById(

                "camera-video"

            );



        const closeCameraButton =

            document.getElementById(

                "close-camera-button"

            );



        const closeUploadButton =

            document.getElementById(

                "close-upload-button"

            );



        const chooseImageButton =

            document.getElementById(

                "choose-image-button"

            );



        const uploadDropZone =
            document.getElementById("upload-drop-zone");

        const uploadHint =
            document.getElementById("upload-hint");

        const imageFileInput =

            document.getElementById(

                "image-file-input"

            );



        const capturedImage =

            document.getElementById(

                "captured-image"

            );



        const croppedImage =

            document.getElementById(

                "cropped-image"

            );



        const canvas =

            document.getElementById(

                "capture-canvas"

            );



        const statusMessage =

            document.getElementById(

                "status"

            );



        const shutterButton =

            document.getElementById(

                "shutter-button"

            );



        const restartButton =

            document.getElementById(

                "restart-button"

            );



        const useCropButton =

            document.getElementById(

                "use-crop-button"

            );



        const editCropButton =

            document.getElementById(

                "edit-crop-button"

            );



        const confirmCropButton =

            document.getElementById(

                "confirm-crop-button"

            );



        const zoomControls =

            document.getElementById(

                "zoom-controls"

            );



        const zoomSlider =

            document.getElementById(

                "zoom-slider"

            );



        const zoomMinLabel =

            document.getElementById(

                "zoom-min"

            );



        const zoomMaxLabel =

            document.getElementById(

                "zoom-max"

            );



        /*

         * ====================================================

         * COMPONENT STATE

         * ====================================================

         */



        let componentMode = "camera";



        let cameraStream = null;

        let videoTrack = null;

        let cropper = null;



        let capturedPhotoData = null;

        let croppedPhotoData = null;



        let componentInitialized = false;

        let submissionInProgress = false;



        /*

         * ====================================================

         * GENERAL HELPERS

         * ====================================================

         */



        function resetConfirmButton() {

            submissionInProgress = false;



            confirmCropButton.disabled =

                false;



            confirmCropButton.textContent =

                "Confirm";

        }



        function isPhoneOrTablet() {

            if (

                navigator.userAgentData

                &&

                typeof navigator

                    .userAgentData

                    .mobile

                    === "boolean"

            ) {

                return navigator

                    .userAgentData

                    .mobile;

            }



            return /Android|iPhone|iPad|iPod/i

                .test(

                    navigator.userAgent

                );

        }



        function setComponentActive(

            isActive

        ) {

            document.body.classList.toggle(

                "component-active",

                isActive

            );

        }



        function stopCamera() {

            if (cameraStream) {

                cameraStream

                    .getTracks()

                    .forEach(

                        function (track) {

                            track.stop();

                        }

                    );

            }



            cameraStream = null;

            videoTrack = null;

            video.srcObject = null;

        }



        function destroyCropper() {

            if (cropper) {

                cropper.destroy();

                cropper = null;

            }

        }



        function showOnly(

            screenToShow

        ) {

            cameraScreen.style.display =

                screenToShow === cameraScreen

                    ? "block"

                    : "none";



            uploadScreen.style.display =

                screenToShow === uploadScreen

                    ? "block"

                    : "none";



            reviewScreen.style.display =

                screenToShow === reviewScreen

                    ? "block"

                    : "none";



            cropResultScreen.style.display =

                screenToShow

                    === cropResultScreen

                    ? "block"

                    : "none";



            setStreamlitFrameHeight();

        }



        function updateRestartButton() {

            restartButton.textContent =

                componentMode === "upload"

                    ? "Choose Another"

                    : "Retake";

        }



        function resetImageState() {

            capturedPhotoData = null;

            croppedPhotoData = null;



            resetConfirmButton();



            capturedImage.onload = null;

            capturedImage.onerror = null;



            capturedImage.removeAttribute(

                "src"

            );



            croppedImage.removeAttribute(

                "src"

            );

        }



        /*

         * ====================================================

         * CANCEL WORKFLOW

         * ====================================================

         */



        function cancelWorkflow() {

            stopCamera();

            destroyCropper();



            imageFileInput.value = "";



            sendValueToStreamlit({

                action: "cancel",

                submission_id: Date.now()

            });

        }



        /*

         * ====================================================

         * CAMERA ZOOM

         * ====================================================

         */



        async function configureZoom() {

            zoomControls.style.display =

                "none";



            if (

                !videoTrack

                ||

                typeof videoTrack

                    .getCapabilities

                    !== "function"

            ) {

                return;

            }



            const capabilities =

                videoTrack.getCapabilities();



            if (

                !capabilities.zoom

                ||

                typeof capabilities.zoom.min

                    !== "number"

                ||

                typeof capabilities.zoom.max

                    !== "number"

            ) {

                return;

            }



            const settings =

                typeof videoTrack

                    .getSettings

                    === "function"

                    ? videoTrack.getSettings()

                    : {};



            const minimumZoom =

                capabilities.zoom.min;



            const maximumZoom =

                capabilities.zoom.max;



            const zoomStep =

                capabilities.zoom.step

                || 0.1;



            const currentZoom =

                typeof settings.zoom

                    === "number"

                    ? settings.zoom

                    : minimumZoom;



            zoomSlider.min =

                minimumZoom;



            zoomSlider.max =

                maximumZoom;



            zoomSlider.step =

                zoomStep;



            zoomSlider.value =

                currentZoom;



            zoomMinLabel.textContent =

                `${minimumZoom.toFixed(1)}×`;



            zoomMaxLabel.textContent =

                `${maximumZoom.toFixed(1)}×`;



            if (

                maximumZoom

                > minimumZoom

            ) {

                zoomControls.style.display =

                    "flex";

            }

        }



        async function changeZoom() {

            if (!videoTrack) {

                return;

            }



            const selectedZoom =

                Number(

                    zoomSlider.value

                );



            try {

                await videoTrack

                    .applyConstraints({

                        advanced: [

                            {

                                zoom:

                                    selectedZoom

                            }

                        ]

                    });

            } catch (error) {

                console.error(

                    "Zoom could not be changed:",

                    error

                );

            }

        }



        /*

         * ====================================================

         * CAMERA MODE

         * ====================================================

         */



        async function openCamera() {

            stopCamera();

            destroyCropper();

            resetImageState();



            imageFileInput.value = "";



            setComponentActive(true);

            showOnly(cameraScreen);



            statusMessage.style.display =

                "block";



            statusMessage.textContent =

                "Opening camera...";



            zoomControls.style.display =

                "none";



            const mobileDevice =

                isPhoneOrTablet();



            const videoConstraints =

                mobileDevice

                    ? {

                        facingMode: {

                            ideal:

                                "environment"

                        },

                        width: {

                            ideal: 1920

                        },

                        height: {

                            ideal: 1080

                        }

                    }

                    : {

                        width: {

                            ideal: 1920

                        },

                        height: {

                            ideal: 1080

                        }

                    };



            try {

                cameraStream =

                    await navigator

                        .mediaDevices

                        .getUserMedia({

                            video:

                                videoConstraints,

                            audio: false

                        });



                videoTrack =

                    cameraStream

                        .getVideoTracks()[0];



                video.srcObject =

                    cameraStream;



                await video.play();

                await configureZoom();



                statusMessage.style.display =

                    "none";



            } catch (error) {

                console.error(

                    "Camera could not be opened:",

                    error

                );



                statusMessage.style.display =

                    "block";



                statusMessage.textContent =

                    "The camera could not open. Check your browser camera permissions.";

            }

        }



        function takePhoto() {

            if (

                !video.videoWidth

                ||

                !video.videoHeight

            ) {

                statusMessage.style.display =

                    "block";



                statusMessage.textContent =

                    "The camera is still loading.";



                return;

            }



            canvas.width =

                video.videoWidth;



            canvas.height =

                video.videoHeight;



            const context =

                canvas.getContext("2d");



            if (!context) {

                statusMessage.style.display =

                    "block";



                statusMessage.textContent =

                    "The photograph could not be created.";



                return;

            }



            context.drawImage(

                video,

                0,

                0,

                canvas.width,

                canvas.height

            );



            capturedPhotoData =

                canvas.toDataURL(

                    "image/jpeg",

                    0.95

                );



            stopCamera();



            croppedPhotoData = null;

            resetConfirmButton();



            prepareImageForCropping(

                capturedPhotoData

            );

        }



        /*

         * ====================================================

         * UPLOAD MODE

         * ====================================================

         */



        function showUploadScreen() {

            stopCamera();

            destroyCropper();

            resetImageState();



            imageFileInput.value = "";



            setComponentActive(false);

            showOnly(uploadScreen);

        }



        function openUploadPicker() {

            /*

             * Resetting the value allows the same image to be

             * selected again after returning to this screen.

             */

            imageFileInput.value = "";

            imageFileInput.click();

        }



        function loadUploadedImage(

            file

        ) {

            if (!file) {

                return;

            }



            if (

                file.type

                &&

                !file.type.startsWith(

                    "image/"

                )

            ) {

                alert(

                    "Please choose an image file."

                );



                return;

            }



            const reader =

                new FileReader();



            reader.onload =

                function (event) {

                    const uploadedData =

                        event.target.result;



                    if (

                        typeof uploadedData

                            !== "string"

                        ||

                        !uploadedData

                            .startsWith(

                                "data:image/"

                            )

                    ) {

                        alert(

                            "The selected image could not be read."

                        );



                        return;

                    }



                    capturedPhotoData =

                        uploadedData;



                    croppedPhotoData = null;



                    stopCamera();

                    destroyCropper();

                    resetConfirmButton();



                    prepareImageForCropping(

                        capturedPhotoData

                    );

                };



            reader.onerror =

                function () {

                    alert(

                        "The selected image could not be read."

                    );

                };



            reader.readAsDataURL(

                file

            );

        }



        function handleUploadedFile() {

            const selectedFile =

                imageFileInput.files

                &&

                imageFileInput.files.length

                    > 0

                    ? imageFileInput.files[0]

                    : null;



            loadUploadedImage(

                selectedFile

            );

        }



        /*

         * ====================================================

         * CROPPER SETUP

         * ====================================================

         */



        function imageFileFromTransfer(transfer) {
            if (!transfer) return null;
            const files = Array.from(transfer.files || []);
            const directFile = files.find(file => file.type.startsWith("image/"));
            if (directFile) return directFile;
            const items = Array.from(transfer.items || []);
            const imageItem = items.find(item =>
                item.kind === "file" && item.type.startsWith("image/")
            );
            return imageItem ? imageItem.getAsFile() : null;
        }

        let dragDepth = 0;
        uploadDropZone.addEventListener("dragenter", event => {
            event.preventDefault();
            dragDepth += 1;
            uploadDropZone.classList.add("drag-over");
        });
        uploadDropZone.addEventListener("dragover", event => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "copy";
        });
        uploadDropZone.addEventListener("dragleave", event => {
            event.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) uploadDropZone.classList.remove("drag-over");
        });
        uploadDropZone.addEventListener("drop", event => {
            event.preventDefault();
            dragDepth = 0;
            uploadDropZone.classList.remove("drag-over");
            const file = imageFileFromTransfer(event.dataTransfer);
            if (file) {
                loadUploadedImage(file);
            } else {
                uploadHint.textContent =
                    "That drag contains a link, not an image. Copy the image and paste it here instead.";
            }
        });

        document.addEventListener("paste", event => {
            if (uploadScreen.style.display === "none") return;
            const file = imageFileFromTransfer(event.clipboardData);
            if (file) {
                event.preventDefault();
                loadUploadedImage(file);
            }
        });

        function prepareImageForCropping(

            imageData

        ) {

            destroyCropper();



            capturedImage.onload =

                function () {

                    capturedImage.onload =

                        null;



                    initializeCropper();

                };



            capturedImage.onerror =

                function () {

                    capturedImage.onerror =

                        null;



                    alert(

                        "The selected image could not be opened."

                    );



                    restartWorkflow();

                };



            capturedImage.src =

                imageData;



            showOnly(reviewScreen);

            setComponentActive(true);

        }



        function initializeCropper() {

            destroyCropper();



            cropper = new Cropper(

                capturedImage,

                {

                    viewMode: 1,

                    dragMode: "move",



                    aspectRatio: NaN,

                    autoCropArea: 0.82,



                    responsive: true,

                    restore: false,



                    guides: true,

                    center: true,

                    highlight: false,

                    background: false,



                    movable: true,



                    zoomable: false,

                    zoomOnTouch: false,

                    zoomOnWheel: false,



                    rotatable: false,

                    scalable: false,



                    cropBoxMovable: true,

                    cropBoxResizable: true,



                    toggleDragModeOnDblclick:

                        false,



                    ready() {

                        setComponentActive(

                            true

                        );



                        setStreamlitFrameHeight();

                    }

                }

            );

        }



        function createCrop() {

            resetConfirmButton();



            if (!cropper) {

                alert(

                    "The crop tool is still loading. Try again."

                );



                return;

            }



            const cropData =

                cropper.getData(true);



            if (

                cropData.width < 10

                ||

                cropData.height < 10

            ) {

                alert(

                    "Please select a larger area."

                );



                return;

            }



            const croppedCanvas =

                cropper.getCroppedCanvas({

                    imageSmoothingEnabled:

                        true,



                    imageSmoothingQuality:

                        "high",



                    maxWidth: 1600,

                    maxHeight: 1600,



                    fillColor: "#000000"

                });



            if (!croppedCanvas) {

                alert(

                    "The cropped image could not be created."

                );



                return;

            }



            croppedPhotoData =

                croppedCanvas.toDataURL(

                    "image/jpeg",

                    0.95

                );



            croppedImage.src =

                croppedPhotoData;



            showOnly(

                cropResultScreen

            );



            setComponentActive(true);

        }



        function editCrop() {

            if (!capturedPhotoData) {

                return;

            }



            resetConfirmButton();



            croppedPhotoData = null;



            croppedImage.removeAttribute(

                "src"

            );



            showOnly(reviewScreen);

            setComponentActive(true);



            /*

             * Usually the Cropper instance still exists.

             * Recreate it only if needed.

             */

            if (!cropper) {

                prepareImageForCropping(

                    capturedPhotoData

                );

            }

        }



        /*

         * ====================================================

         * RESTART CURRENT MODE

         * ====================================================

         */



        function restartWorkflow() {

            if (

                componentMode

                === "upload"

            ) {

                showUploadScreen();

            } else {

                openCamera();

            }

        }



        /*

         * ====================================================

         * RETURN FINAL IMAGE TO STREAMLIT

         * ====================================================

         */



        function confirmCrop() {

            if (!croppedPhotoData) {

                alert(

                    "No cropped image is available."

                );



                return;

            }



            if (submissionInProgress) {

                return;

            }



            submissionInProgress = true;



            confirmCropButton.disabled =

                true;



            confirmCropButton.textContent =

                "Sending...";



            sendValueToStreamlit({

                action: "confirm",



                cropped_image:

                    croppedPhotoData,



                submission_id:

                    Date.now()

            });



            window.setTimeout(

                function () {

                    resetConfirmButton();

                },

                750

            );

        }



        /*

         * ====================================================

         * STREAMLIT RENDER EVENT

         * ====================================================

         */



        function handleStreamlitMessage(

            event

        ) {

            const message =

                event.data;



            if (

                !message

                ||

                message.type

                    !== "streamlit:render"

            ) {

                return;

            }



            const args =

                message.args || {};



            const requestedMode =

                args.mode === "upload"

                    ? "upload"

                    : "camera";



            componentMode =

                requestedMode;



            updateRestartButton();

            setStreamlitFrameHeight();

            resetConfirmButton();



            if (!componentInitialized) {

                componentInitialized = true;



                if (

                    componentMode

                    === "upload"

                ) {

                    showUploadScreen();

                } else {

                    openCamera();

                }

            }

        }



        /*

         * ====================================================

         * EVENT LISTENERS

         * ====================================================

         */



        window.addEventListener(

            "message",

            handleStreamlitMessage

        );



        window.addEventListener(

            "resize",

            function () {

                setStreamlitFrameHeight();

            }

        );



        closeCameraButton.addEventListener(

            "click",

            cancelWorkflow

        );



        closeUploadButton.addEventListener(

            "click",

            cancelWorkflow

        );



        chooseImageButton.addEventListener(

            "click",

            openUploadPicker

        );



        imageFileInput.addEventListener(

            "change",

            handleUploadedFile

        );



        zoomSlider.addEventListener(

            "input",

            changeZoom

        );



        shutterButton.addEventListener(

            "click",

            takePhoto

        );



        restartButton.addEventListener(

            "click",

            restartWorkflow

        );



        useCropButton.addEventListener(

            "click",

            createCrop

        );



        editCropButton.addEventListener(

            "click",

            editCrop

        );



        confirmCropButton.addEventListener(

            "click",

            confirmCrop

        );



        window.addEventListener(

            "beforeunload",

            function () {

                stopCamera();

                destroyCropper();

            }

        );



        /*

         * ====================================================

         * INITIALIZE STREAMLIT COMPONENT

         * ====================================================

         */



        notifyStreamlitReady();

        setStreamlitFrameHeight();

    </script>

</body>

</html>
